name: linkage-mapping
channels:
  - bioconda
  - conda-forge
dependencies:
  # aligners / mappers
  - bwa=0.7.18
  - bowtie2=2.5.4

  # SAM/BAM/VCF toolkits
  - samtools=1.21
  - bcftools=1.13
  - htslib=1.21
  - picard=3.4.0

  # interval / QC / trimming tools
  - bedtools=2.31.1
  - trimmomatic=0.40
  - datamash=1.9

  # languages / runtimes
  - python=3.8.12
  - perl=5.32.1
  - r-base=4.4.0

  # R packages used directly in scripts (verify against your library() calls)
  - r-dplyr=1.2.0
  - r-here=1.0.2
  - r-purrr=1.2.1

  # python packages used directly in scripts
  - numpy=1.21.2

  - pip=24.3.1
